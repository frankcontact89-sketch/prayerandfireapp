name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches:
      - improve/community-ui-review-2026-10-27
    paths:
      # Build when app code, native iOS project, dependencies or release workflow changes.
      - '.github/workflows/testflight-upload.yml'
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'

permissions:
  contents: read

# Avoid simultaneous signed uploads competing for the same iOS project and Apple session.
concurrency:
  group: prayer-fire-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.frankcontact89.prayerandfiremobile
      APP_VERSION: '1.1'
      BUILD_NUMBER: '47'
      APPLE_TEAM_ID: 2UU7S882KZ
      APP_STORE_CONNECT_KEY_ID: NGM28WWYM2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose branch merge and release asset
        if: github.ref_name != 'main'
        run: |
          git fetch --no-tags origin main
          echo "BETA_TREE=$(git rev-parse HEAD^{tree})"
          echo "MAIN_TREE=$(git rev-parse origin/main^{tree})"
          if git merge-tree --write-tree origin/main HEAD > "$RUNNER_TEMP/pf-merge-tree.txt" 2>&1; then
            echo "MERGE_TREE=$(head -n 1 "$RUNNER_TEMP/pf-merge-tree.txt")"
          else
            echo "::warning::Branch merge has conflicts; see diagnostics below"
            sed -n '1,90p' "$RUNNER_TEMP/pf-merge-tree.txt"
          fi
          file public/prayer-fire-official-logo.webp || true
          echo "BRANCH_HEAD=$(git rev-parse HEAD)"
          echo "MAIN_HEAD=$(git rev-parse origin/main)"
          echo "BRANCH_BEHIND=$(git rev-list --count HEAD..origin/main)"
          echo "BRANCH_AHEAD=$(git rev-list --count origin/main..HEAD)"
          echo "=== Merge conflict paths ==="
          git merge-tree origin/main HEAD 2>/dev/null | grep -E "^(changed in both|added in both|removed in|CONFLICT)" | head -n 60 || true
          git diff --name-status origin/main...HEAD | head -n 80 || true

      - name: Check beta branch divergence
        if: github.ref_name != 'main'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Beta is $BEHIND commits behind main. Building the explicitly selected beta commit for TestFlight; merge is still required before release."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select a unique TestFlight build number
        run: |
          set -euo pipefail
          # Builds 46 and 47 were used during earlier attempts. Avoid reusing
          # the same CFBundleVersion across retries or later workflow runs.
          # This workflow has already attempted builds 46 and 47. A fixed
          # offset avoids rejecting fresh runs when the workflow run counter
          # is below 44 (the old calculation could produce build <= 47).
          # A rerun keeps GITHUB_RUN_NUMBER but increments GITHUB_RUN_ATTEMPT.
          # Give each upload attempt a distinct CFBundleVersion to avoid Apple duplicate-build rejection.
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$GITHUB_RUN_ATTEMPT" -ge 100 ]; then
            echo "::error::More than 99 attempts for this workflow run; use a fresh workflow run to keep build numbers unique."
            exit 1
          fi
          if [ "$BUILD_NUMBER" -le 47 ]; then
            echo "Refusing a non-incremental TestFlight build number: $BUILD_NUMBER"
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Preparing Prayer & Fire ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Verify App Store Connect credentials
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required GitHub secret: $v"
              exit 1
            fi
          done

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path

          raw = os.environ['APP_STORE_CONNECT_API_KEY']

          def normalize(s: str) -> str:
              s = s.replace('\r\n', '\n').replace('\r', '\n').strip()
              if '\\n' in s and '\n' not in s:
                  s = s.replace('\\n', '\n')
              if len(s) >= 2 and s[0] == s[-1] and s[0] in {'"', "'"}:
                  s = s[1:-1].strip()
              return s

          key = normalize(raw)
          begin = '-----BEGIN PRIVATE KEY-----'
          end = '-----END PRIVATE KEY-----'

          if begin not in key or end not in key:
              compact = re.sub(r'\s+', '', raw)
              try:
                  decoded = base64.b64decode(compact, validate=True).decode('utf-8')
                  decoded = normalize(decoded)
                  if begin in decoded and end in decoded:
                      key = decoded
                      print('Detected base64-encoded .p8 secret')
              except Exception:
                  pass

          if begin not in key or end not in key:
              raise SystemExit('App Store Connect API key secret is not a complete .p8 private key')

          start = key.index(begin)
          finish = key.index(end, start) + len(end)
          key = key[start:finish] + '\n'
          Path(os.environ['KEY_PATH']).write_text(key, encoding='utf-8')
          PY
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies and build web app
        run: |
          set -euo pipefail
          # Resolve the current package.json/lockfile drift in the isolated CI workspace.
          # npm ci then installs exactly the resolved dependency tree.
          mkdir -p "$RUNNER_TEMP/testflight-diagnostics"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ 2>&1 | tee "$RUNNER_TEMP/testflight-diagnostics/npm-lock-resolution.log"
          # Some committed lock entries point to Lovable's private npm proxy.
          # Normalize those tarball URLs to the public npm registry before npm ci.
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          let fixed = 0;
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            if (!entry?.resolved?.includes('lovable-core-prod/sandbox-npm-cache/')) continue;
            const pkgName = name.replace(/^node_modules\//, '');
            if (!pkgName || !entry.version) continue;
            const tarName = pkgName.split('/').pop();
            entry.resolved = `https://registry.npmjs.org/${pkgName}/-/${tarName}-${entry.version}.tgz`;
            fixed++;
          }
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          console.log(`Normalized ${fixed} Lovable-proxy npm tarball URLs`);
          NODE
          # Reject remaining private tarball URLs before the clean installation.
          if grep -q 'lovable-core-prod/sandbox-npm-cache/' package-lock.json; then
            echo "::error::Private Lovable npm tarball URLs remain in package-lock.json"
            exit 1
          fi
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/ 2>&1 | tee "$RUNNER_TEMP/testflight-diagnostics/npm-ci.log"
          # Ensure the resolved lockfile now matches the declared direct dependencies.
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''] ?? {};
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
              if (root[section]?.[name] !== spec) {
                throw new Error(`Lockfile mismatch for ${name}: package.json=${spec}, lock=${root[section]?.[name] ?? 'missing'}`);
              }
            }
          }
          console.log('All declared dependencies match the resolved lockfile.');
          NODE
          # Verify that Capacitor plugins are installed and compatible before the web/iOS build.
          npm ls @capacitor/core @capacitor/ios @capacitor/camera @capacitor/push-notifications @capacitor/share --depth=0
          npm run build
          npx tsc --noEmit -p tsconfig.app.json
          test -s dist/prayer-fire-official-logo.webp || { echo "::error::Official logo missing from built web assets"; exit 1; }
          npx cap sync ios
          test -s ios/App/App/public/index.html || { echo "::error::Capacitor did not copy web entry point to iOS"; exit 1; }
          test -d ios/App/App/public/assets || { echo "::error::Capacitor did not copy compiled web assets to iOS"; exit 1; }

      - name: Save resolved dependency lockfile for repository update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-fire-resolved-package-lock-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: package-lock.json
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare official Prayer & Fire iOS icon
        run: |
          set -euo pipefail
          ICON_SRC="public/prayer-fire-official-logo.webp"
          ICON_OUT="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "::error::Official Prayer & Fire logo asset is missing. Refusing to use generic placeholder."
            exit 1
          fi
          ICON_WIDTH=$(sips -g pixelWidth "$ICON_SRC" | awk '/pixelWidth/{print $2}')
          ICON_HEIGHT=$(sips -g pixelHeight "$ICON_SRC" | awk '/pixelHeight/{print $2}')
          if [ "$ICON_WIDTH" != "$ICON_HEIGHT" ]; then
            echo "::error::Official iOS artwork must be square; got ${ICON_WIDTH}x${ICON_HEIGHT}"
            exit 1
          fi
          if [ "$ICON_WIDTH" -lt 1024 ]; then
            echo "::warning::Official logo source is ${ICON_WIDTH}px; scaling the SAME official artwork to 1024px for TestFlight. Replace source with high-resolution master before production release."
          fi
          sips -s format png "$ICON_SRC" --out "$RUNNER_TEMP/pf-official.png" >/dev/null
          sips -z 1024 1024 "$RUNNER_TEMP/pf-official.png" --out "$ICON_OUT" >/dev/null
          test "$(sips -g pixelWidth "$ICON_OUT" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON_OUT" | awk '/pixelHeight/{print $2}')" = "1024"
          # Fail before signing if the asset catalog references a different icon file.
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          entries = json.loads((catalog / "Contents.json").read_text())["images"]
          assert any(e.get("filename") == "AppIcon-512@2x.png" for e in entries), "AppIcon catalog does not reference generated icon"
          assert (catalog / "AppIcon-512@2x.png").stat().st_size > 0, "Generated AppIcon is empty"
          PY
          echo "Official Prayer & Fire artwork installed as AppIcon"

      - name: Smoke-test packaged app in iOS Simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/sim-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find "$RUNNER_TEMP/sim-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"

          echo "Verifying packaged Capacitor resources..."
          test -f "$APP_PATH/public/index.html"
          test -f "$APP_PATH/capacitor.config.json"
          test -d "$APP_PATH/public/assets"
          echo "Packaged web assets are present"

          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" "$APP_BUNDLE_ID")
          printf '%s\n' "$LAUNCH_OUTPUT"
          PID=$(printf '%s\n' "$LAUNCH_OUTPUT" | awk -F ': ' 'NF==2{print $2}' | tail -1)
          if ! [[ "$PID" =~ ^[0-9]+$ ]]; then
            echo "Could not determine launched app PID"
            exit 1
          fi

          sleep 10
          if ! xcrun simctl spawn "$UDID" /bin/ps -p "$PID" -o pid= 2>/dev/null | grep -q "$PID"; then
            echo "Prayer & Fire exited during startup"
            echo "--- Recent simulator logs ---"
            xcrun simctl spawn "$UDID" log show --last 2m --style compact \
              --predicate 'process == "App" OR eventMessage CONTAINS[c] "prayerandfire"' || true
            exit 1
          fi
          echo "Prayer & Fire remained running after launch for 10 seconds"

      - name: Confirm TestFlight build number
        run: |
          echo "Uploading Prayer & Fire ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Archive iOS app with automatic signing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/testflight-diagnostics"
          echo "Archive build number: $BUILD_NUMBER"
          set +e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PrayerAndFire.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            clean archive 2>&1 | tee "$RUNNER_TEMP/testflight-diagnostics/archive.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Xcode archive failed. See archive.log diagnostic artifact."
            grep -Ei 'error:|provisioning profile|signing certificate|No profiles|authentication failed|requires a development team|failed' "$RUNNER_TEMP/testflight-diagnostics/archive.log" | tail -50 || true
            exit "$RESULT"
          fi

      - name: Create automatic App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA with automatic signing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export" "$RUNNER_TEMP/testflight-diagnostics"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PrayerAndFire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/testflight-diagnostics/export.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::IPA export failed. See export.log diagnostic artifact."
            grep -Ei 'error:|provisioning|signing|certificate|failed' "$RUNNER_TEMP/testflight-diagnostics/export.log" | tail -50 || true
            exit "$RESULT"
          fi
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          set +e
          VALIDATION_OUTPUT=$(xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1)
          VALIDATION_STATUS=$?
          printf '%s\n' "$VALIDATION_OUTPUT"
          if [ "$VALIDATION_STATUS" -ne 0 ]; then
            echo "Apple validation failed with exit code $VALIDATION_STATUS"
            exit "$VALIDATION_STATUS"
          fi
          echo "Apple validation succeeded"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Summary
        run: |
          echo "### TestFlight upload submitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Prayer & Fire ${APP_VERSION} (${BUILD_NUMBER}) was uploaded to App Store Connect for TestFlight processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Save sanitized TestFlight diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/testflight-diagnostics"
          echo "Workflow: $GITHUB_WORKFLOW" > "$RUNNER_TEMP/testflight-diagnostics/context.txt"
          echo "Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT" >> "$RUNNER_TEMP/testflight-diagnostics/context.txt"
          echo "Commit: $GITHUB_SHA" >> "$RUNNER_TEMP/testflight-diagnostics/context.txt"
          echo "Build: $BUILD_NUMBER" >> "$RUNNER_TEMP/testflight-diagnostics/context.txt"
          echo "Inspect the failed step and archive/export log for errors; do not post secrets."

      - name: Upload TestFlight diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-diagnostics/
          retention-days: 7
          if-no-files-found: warn
