name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/testflight-upload.yml'

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.frankcontact89.prayerandfiremobile
      APP_VERSION: '1.1'
      BUILD_NUMBER: '25'
      APPLE_TEAM_ID: 2UU7S882KZ
      APP_STORE_CONNECT_KEY_ID: NGM28WWYM2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify App Store Connect credentials
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required GitHub secret: $v"
              exit 1
            fi
          done

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path

          raw = os.environ['APP_STORE_CONNECT_API_KEY']
          print(f"API key secret length: {len(raw)}")
          print(f"Contains BEGIN marker: {'BEGIN PRIVATE KEY' in raw}")
          print(f"Contains END marker: {'END PRIVATE KEY' in raw}")

          def normalize(s: str) -> str:
              s = s.replace('\r\n', '\n').replace('\r', '\n').strip()
              if '\\n' in s and '\n' not in s:
                  s = s.replace('\\n', '\n')
              if len(s) >= 2 and s[0] == s[-1] and s[0] in {'"', "'"}:
                  s = s[1:-1].strip()
              return s

          key = normalize(raw)
          begin = '-----BEGIN PRIVATE KEY-----'
          end = '-----END PRIVATE KEY-----'

          if begin not in key or end not in key:
              # Accept a base64-encoded .p8 as a fallback.
              compact = re.sub(r'\s+', '', raw)
              try:
                  decoded = base64.b64decode(compact, validate=True).decode('utf-8')
                  decoded = normalize(decoded)
                  if begin in decoded and end in decoded:
                      key = decoded
                      print('Detected base64-encoded .p8 secret')
              except Exception:
                  pass

          if begin not in key or end not in key:
              raise SystemExit('App Store Connect API key secret is not a complete .p8 private key')

          start = key.index(begin)
          finish = key.index(end, start) + len(end)
          key = key[start:finish] + '\n'
          Path(os.environ['KEY_PATH']).write_text(key, encoding='utf-8')
          PY
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies and build web app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios

      - name: Confirm TestFlight build number
        run: |
          echo "Uploading Prayer & Fire ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Archive iOS app with automatic signing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PrayerAndFire.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      - name: Create automatic App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA with automatic signing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PrayerAndFire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"


      - name: Validate with App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Summary
        run: |
          echo "### TestFlight upload submitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Prayer & Fire ${APP_VERSION} (${BUILD_NUMBER}) was uploaded to App Store Connect for TestFlight processing." >> "$GITHUB_STEP_SUMMARY"
