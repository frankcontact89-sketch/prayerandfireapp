name: Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Verify production Capacitor config
        run: |
          grep -q "com.frankcontact89.prayerandfiremobile" capacitor.config.ts
          grep -q "webDir: 'dist'" capacitor.config.ts
          if grep -q "server:.*lovableproject" capacitor.config.ts; then
            echo "Dev server definition is present but must stay gated by CAP_DEV_SERVER."
          fi
