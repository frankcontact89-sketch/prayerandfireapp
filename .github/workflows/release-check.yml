name: Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Lint (advisory while legacy issues are cleaned up)
        continue-on-error: true
        run: npm run lint
      - name: Verify production Capacitor config
        run: |
          grep -q "com.frankcontact89.prayerandfiremobile" capacitor.config.ts
          grep -q "webDir: 'dist'" capacitor.config.ts
          grep -q "const useDevServer = process.env.CAP_DEV_SERVER === '1'" capacitor.config.ts
