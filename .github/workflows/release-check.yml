name: Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check package-lock drift (advisory)
        continue-on-error: true
        run: git diff --exit-code -- package-lock.json

      - name: Build production app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify production Capacitor config
        run: |
          grep -q "appId: 'com.frankcontact89.prayerandfiremobile'" capacitor.config.ts
          grep -q "appName: 'Prayer & Fire'" capacitor.config.ts
          grep -q "webDir: 'dist'" capacitor.config.ts
          grep -q "const useDevServer = process.env.CAP_DEV_SERVER === '1'" capacitor.config.ts

      - name: Verify iOS App Store metadata
        run: |
          test -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q '<string>Prayer &amp; Fire</string>' ios/App/App/Info.plist
          grep -q '<key>NSCameraUsageDescription</key>' ios/App/App/Info.plist
          grep -q '<key>NSPhotoLibraryUsageDescription</key>' ios/App/App/Info.plist
          grep -q '<key>NSMicrophoneUsageDescription</key>' ios/App/App/Info.plist
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.frankcontact89.prayerandfiremobile;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'capacitor.config.json in Resources' ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/App.entitlements
          grep -q '<string>aps-environment</string>' ios/App/App/App.entitlements || grep -q 'aps-environment' ios/App/App/App.entitlements
          test "$(grep -c 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'CODE_SIGN_STYLE = Automatic;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'public in Resources' ios/App/App.xcodeproj/project.pbxproj
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 38;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'MARKETING_VERSION = 1.1;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2
