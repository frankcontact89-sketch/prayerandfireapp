name: Test Turnix relay in isolated Supabase

on:
  push:
    branches: [test/turnix-relay]
    paths:
      - .github/workflows/turnix-relay-test.yml
      - tests/turnix-live.mjs
      - tests/prayer-audio-transport.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public API key for the isolated Supabase test project.
      PRAYER_TEST_PUBLISHABLE_KEY: sb_publishable_tuOqa-o2MpSBjQHvbi3NEw_RghmA9tN
      PRAYER_TEST_ICE_FILE: ${{ runner.temp }}/turnix-ice.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Request temporary TURN credentials
        run: node tests/turnix-live.mjs
      - name: Check bidirectional audio with TURN as the only route
        run: |
          npm install --prefix "$RUNNER_TEMP/turn-test" werift@0.28.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/turn-test/node_modules" node tests/prayer-audio-transport.cjs
      - name: Remove temporary relay credentials
        if: always()
        run: rm -f "$PRAYER_TEST_ICE_FILE"
