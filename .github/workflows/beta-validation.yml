name: Validate Prayer & Fire beta

on:
  push:
    branches:
      - improve/community-ui-review-2026-10-27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Install and build beta UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Temporary compatibility check while package-lock.json is reconciled.
      - name: Install dependencies from package.json
        run: npm install --no-save --package-lock=false
      - name: Compile production web bundle
        run: npm run build
      - name: Check TypeScript app
        run: npx tsc --noEmit -p tsconfig.app.json

  native-ios-build:
    name: Compile unsigned iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify official iOS icon source
        run: |
          set -euo pipefail
          ICON="public/prayer-fire-official-logo.webp"
          test -s "$ICON" || { echo "::error::Missing official icon source: $ICON"; exit 1; }
          sips -g pixelWidth -g pixelHeight "$ICON"
          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/{print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/{print $2}')
          if [ "$WIDTH" != "$HEIGHT" ]; then
            echo "::error::Official icon must be square (got ${WIDTH}x${HEIGHT})"
            exit 1
          fi
          if [ "$WIDTH" -lt 1024 ] || [ "$HEIGHT" -lt 1024 ]; then
            echo "::error::Official icon source must be at least 1024x1024 pixels"
            exit 1
          fi
      - name: Build bundled web assets
        run: npm run build
      - name: Sync Capacitor native project
        run: npx cap sync ios
      - name: Install official icon into iOS asset catalog
        run: |
          set -euo pipefail
          ICON_SRC="public/prayer-fire-official-logo.webp"
          ICON_OUT="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          sips -s format png "$ICON_SRC" --out "$RUNNER_TEMP/pf-official.png" >/dev/null
          sips -z 1024 1024 "$RUNNER_TEMP/pf-official.png" --out "$ICON_OUT" >/dev/null
          test "$(sips -g pixelWidth "$ICON_OUT" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON_OUT" | awk '/pixelHeight/{print $2}')" = "1024"
      - name: Compile iOS simulator without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
