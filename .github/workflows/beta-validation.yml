name: Validate Prayer & Fire beta

on:
  push:
    branches:
      - improve/community-ui-review-2026-10-27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Install and build beta UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Temporary compatibility check while package-lock.json is reconciled.
      - name: Install dependencies from package.json
        run: npm install --no-save --package-lock=false
      - name: Compile production web bundle
        run: npm run build
      - name: Check TypeScript app
        run: npx tsc --noEmit -p tsconfig.app.json
